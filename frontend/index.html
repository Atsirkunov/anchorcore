<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnchorCore</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Theme before first paint (no flash) — same resolution as src/themeMode.ts.
      (function () {
        var m = null;
        try { m = localStorage.getItem("theme-mode"); } catch (e) {}
        var dark = m === "dark" || (m !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dotBounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-6px); opacity: 1; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes drawerIn {
        from { transform: translateX(100%); }
        to { transform: none; }
      }
      @keyframes drawerOut {
        from { transform: none; }
        to { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .animated { animation: none !important; }
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
