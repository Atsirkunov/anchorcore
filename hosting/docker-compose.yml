# AnchorCore Team self-hosted — ONE container, the same Rust backend as the
# local app (SQLite on the appdata volume, UI embedded, no Postgres sidecar).
# Quickstart + license setup: hosting/README.md
#
#   cp .env.example .env
#   docker compose -f hosting/docker-compose.yml up --build
name: anchorcore-team

services:
  app:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
    image: anchorcore:team
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ANCHOR_DATA_DIR: /data
      ANCHOR_SECRETS_NO_KEYRING: "1"
      # Reach an Ollama running on the host (Linux uses the host-gateway below).
      ANCHOR_OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Team license — mount it below and uncomment this:
      # ANCHOR_LICENSE_FILE: /data/license.json
    volumes:
      - appdata:/data
      # - ./license.json:/data/license.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  appdata:
