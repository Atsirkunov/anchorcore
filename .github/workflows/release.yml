name: Release

# Builds distributable executables on every tag push (e.g. v0.1.0).
# Windows exe is built on a Windows runner; macOS needs a mac runner
# (macos-latest works; see B24 for the free ad-hoc signing alternative).
# Uploads artifacts to the GitHub Release for the tag.
# Rust port: same tag also builds statically-linked Rust binaries (R5.2)
# with embedded frontend/dist via include_dir! — no Python runtime.

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Windows exe (Python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend deps + pyinstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller build
        run: python -m PyInstaller --noconfirm packaging.spec

      - name: Zip exe (onedir output)
        run: |
          cd dist
          Compress-Archive -Path AnchorCore -DestinationPath AnchorCore-windows.zip -Force

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-windows
          path: dist/AnchorCore-windows.zip

  build-macos:
    name: macOS app (Python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Homebrew's CPython builds the sqlite3 module with loadable-extension
      # support (PY_SQLITE_ENABLE_LOAD_EXTENSION). The GitHub hosted-toolcache
      # and python.org builds do NOT, so a binary built with them can't load
      # sqlite_vec and crashes at startup.
      - name: Install Homebrew Python 3.12
        run: |
          brew install python@3.12
          echo "/opt/homebrew/opt/python@3.12/libexec/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install backend deps + pyinstaller
        working-directory: backend
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyinstaller

      - name: PyInstaller build
        run: backend/.venv/bin/python -m PyInstaller --noconfirm packaging.spec

      - name: Ad-hoc sign (free, no Apple account; approval needed on first launch)
        run: codesign --force --deep --sign - dist/AnchorCore.app

      - name: Zip app
        run: |
          cd dist
          rm -f AnchorCore-macos.zip
          zip -r AnchorCore-macos.zip AnchorCore.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-macos
          path: dist/AnchorCore-macos.zip

  # --- Rust port (R5.2) — statically-linked binaries with embedded UI ---
  build-rust-linux:
    name: Rust Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (embedded via include_dir!)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Cargo build --release
        working-directory: rust
        run: cargo build --release --manifest-path Cargo.toml
      - name: Zip binaries
        run: |
          mkdir -p dist
          cp rust/target/release/anchorcore dist/AnchorCore-rust
          cp rust/target/release/anchorcore-mcp dist/anchorcore-mcp 2>/dev/null || true
          cd dist && zip -r AnchorCore-rust-linux.zip AnchorCore-rust anchorcore-mcp
      - name: Upload Rust Linux
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-rust-linux
          path: dist/AnchorCore-rust-linux.zip

  build-rust-macos:
    name: Rust macOS (universal via native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Cargo build --release
        working-directory: rust
        run: cargo build --release --manifest-path Cargo.toml
      - name: Ad-hoc sign Rust binary
        run: codesign --force --deep --sign - rust/target/release/anchorcore
      - name: Zip binaries
        run: |
          mkdir -p dist
          cp rust/target/release/anchorcore dist/AnchorCore-rust
          cp rust/target/release/anchorcore-mcp dist/anchorcore-mcp 2>/dev/null || true
          cd dist && zip -r AnchorCore-rust-macos.zip AnchorCore-rust anchorcore-mcp
      - name: Upload Rust macOS
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-rust-macos
          path: dist/AnchorCore-rust-macos.zip

  build-rust-windows:
    name: Rust Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Cargo build --release
        working-directory: rust
        run: cargo build --release --manifest-path Cargo.toml
      - name: Zip binaries
        run: |
          mkdir -p dist
          cp rust/target/release/anchorcore.exe dist/AnchorCore-rust.exe 2>/dev/null || cp rust/target/release/anchorcore dist/AnchorCore-rust.exe
          cp rust/target/release/anchorcore-mcp.exe dist/anchorcore-mcp.exe 2>/dev/null || cp rust/target/release/anchorcore-mcp dist/anchorcore-mcp.exe 2>/dev/null || true
          cd dist
          Compress-Archive -Path AnchorCore-rust.exe,anchorcore-mcp.exe -DestinationPath AnchorCore-rust-windows.zip -Force
      - name: Upload Rust Windows
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-rust-windows
          path: dist/AnchorCore-rust-windows.zip

  # Optional cross-compile from Linux using `cross` (R5.2 stretch):
  # Uncomment to build all targets from one runner:
  # cross-build:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo install cross --git https://github.com/cross-rs/cross
  #     - uses: actions/setup-node@v4
  #       with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
  #     - run: npm ci && npm run build
  #       working-directory: frontend
  #     - run: cross build --release --target x86_64-unknown-linux-gnu --manifest-path rust/Cargo.toml
  #     - run: cross build --release --target x86_64-pc-windows-gnu --manifest-path rust/Cargo.toml
  #     - run: cross build --release --target x86_64-apple-darwin --manifest-path rust/Cargo.toml

  release:
    name: Attach artifacts to release
    needs: [build-windows, build-macos, build-rust-linux, build-rust-macos, build-rust-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
