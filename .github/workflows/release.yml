name: Release

# Builds distributable apps on every tag push (e.g. v1.0.12) and attaches
# them to the GitHub Release for the tag.
# Assets (Rust — frontend/dist embedded via include_dir!, no Python runtime;
# R20.8: one executable per OS — the app and `anchorcore mcp` are the same file):
#   AnchorCore-windows.zip  — anchorcore.exe
#   AnchorCore-macos.zip    — AnchorCore.app bundle (ad-hoc signed)
#   AnchorCore-linux.zip    — anchorcore
# Also publishes the Team container image (hosting/Dockerfile) to GHCR:
#   ghcr.io/atsirkunov/anchorcore:<version> and :team
# The website Download buttons link straight at the latest windows/macos
# assets (website/src/main.ts); keep these file names stable.
# The site itself (anchorcore.dev, Workers Static Assets) is deployed by the
# deploy-website job below — but only when website/ changed since the previous
# tag, so version-only releases don't churn the edge. Requires repo secrets
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (token needs Workers deploy
# permissions; see https://developers.cloudflare.com/fundamentals/api/get-started/create-token/).
# (Legacy Python jobs removed — backend/ is archived on tag archive/python-final;
# only the conformance suite fetches it frozen.)

on:
  push:
    tags:
      - "v*"

jobs:
  build-rust-linux:
    name: Rust Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (embedded via include_dir!)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Cargo build --release
        working-directory: rust
        run: cargo build --release --manifest-path Cargo.toml
      - name: Zip binaries
        run: |
          mkdir -p dist
          cp rust/target/release/anchorcore dist/anchorcore
          cd dist && zip -r AnchorCore-linux.zip anchorcore
      - name: Assert the MCP-capable binary (R20.5)
        run: |
          set -e
          unzip -l dist/AnchorCore-linux.zip | grep -qE ' anchorcore$' || { echo "FAULT: anchorcore missing from AnchorCore-linux.zip"; exit 1; }
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | ./dist/anchorcore mcp > /tmp/mcp.json || echo "note: mcp exited $? after stdin closed (output is what is asserted)"
          grep -q '"name":"ask"' /tmp/mcp.json || { echo "FAULT: MCP tool 'ask' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"search"' /tmp/mcp.json || { echo "FAULT: MCP tool 'search' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"get_entity"' /tmp/mcp.json || { echo "FAULT: MCP tool 'get_entity' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"get_source"' /tmp/mcp.json || { echo "FAULT: MCP tool 'get_source' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"list_sources"' /tmp/mcp.json || { echo "FAULT: MCP tool 'list_sources' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"memory_status"' /tmp/mcp.json || { echo "FAULT: MCP tool 'memory_status' missing from tools/list"; cat /tmp/mcp.json; exit 1; }
          echo "ok (linux): the shipped binary runs the stdio MCP server with 6 tools incl. search"
      - name: Assert the app-served agent skills (R23.6)
        run: |
          set -e
          export ANCHOR_OPEN_BROWSER=0 ANCHOR_SECRETS_NO_KEYRING=1
          rm -rf /tmp/ac-skill-smoke && mkdir -p /tmp/ac-skill-smoke
          ./dist/anchorcore --port 8129 --data-dir /tmp/ac-skill-smoke --no-tray > /tmp/ac-skill-smoke.log 2>&1 &
          SRV=$!
          trap "kill $SRV 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8129/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8129/health >/dev/null || { echo "FAULT: skill-smoke server did not start"; cat /tmp/ac-skill-smoke.log; exit 1; }
          for SKILL in setup search; do
            curl -sf -D /tmp/skill-headers.txt "http://127.0.0.1:8129/system/skills/$SKILL" -o /tmp/skill-served.md
            grep -qi 'content-type: text/markdown' /tmp/skill-headers.txt || { echo "FAULT: /system/skills/$SKILL is not text/markdown"; cat /tmp/skill-headers.txt; exit 1; }
            cmp /tmp/skill-served.md ".agents/skills/anchorcore-$SKILL/SKILL.md" || { echo "FAULT: /system/skills/$SKILL bytes differ from the repo SKILL.md"; exit 1; }
          done
          if curl -sf http://127.0.0.1:8129/system/skills/nope -o /dev/null; then echo "FAULT: unknown skill did not 404"; exit 1; fi
          echo "ok (linux): /system/skills/:name serves setup + search byte-identical"

      - name: Upload Rust Linux
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-linux
          path: dist/AnchorCore-linux.zip

  build-rust-macos:
    name: Rust macOS (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Cargo build --release
        working-directory: rust
        run: cargo build --release --manifest-path Cargo.toml
      # Same bundle layout as build.sh so local and CI zips are identical:
      # AnchorCore.app wrapping the Rust binary (+ MCP sidecar).
      - name: Bundle AnchorCore.app
        run: |
          VERSION="$(grep -E '^version = ' rust/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          rm -rf "dist/AnchorCore.app"
          mkdir -p "dist/AnchorCore.app/Contents/MacOS"
          mkdir -p "dist/AnchorCore.app/Contents/Resources"
          cp rust/target/release/anchorcore "dist/AnchorCore.app/Contents/MacOS/AnchorCore"
          chmod +x "dist/AnchorCore.app/Contents/MacOS/AnchorCore"
          cat > "dist/AnchorCore.app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>AnchorCore</string>
            <key>CFBundleIdentifier</key><string>com.anchorcore.app</string>
            <key>CFBundleName</key><string>AnchorCore</string>
            <key>CFBundleDisplayName</key><string>AnchorCore</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSUIElement</key><false/>
          </dict>
          </plist>
          PLIST
      - name: Ad-hoc sign app bundle
        run: |
          codesign --force --deep --sign - dist/AnchorCore.app
          codesign --verify --verbose=2 dist/AnchorCore.app 2>&1 | head -n 5 || true
      - name: Zip app
        run: |
          cd dist
          rm -f AnchorCore-macos.zip
          zip -rq AnchorCore-macos.zip AnchorCore.app
      - name: Assert the MCP-capable binary (R20.5)
        run: |
          set -e
          unzip -l dist/AnchorCore-macos.zip | grep -q 'AnchorCore.app/Contents/MacOS/AnchorCore' || { echo "FAULT: app binary missing from AnchorCore-macos.zip"; exit 1; }
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | ./dist/AnchorCore.app/Contents/MacOS/AnchorCore mcp > /tmp/mcp.json || echo "note: mcp exited $? after stdin closed (output is what is asserted)"
          grep -q '"name":"ask"' /tmp/mcp.json || { echo "FAULT: MCP tool 'ask' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"search"' /tmp/mcp.json || { echo "FAULT: MCP tool 'search' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"get_entity"' /tmp/mcp.json || { echo "FAULT: MCP tool 'get_entity' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"get_source"' /tmp/mcp.json || { echo "FAULT: MCP tool 'get_source' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"list_sources"' /tmp/mcp.json || { echo "FAULT: MCP tool 'list_sources' missing from tools/list"; cat /tmp/mcp.json; exit 1; }

          grep -q '"name":"memory_status"' /tmp/mcp.json || { echo "FAULT: MCP tool 'memory_status' missing from tools/list"; cat /tmp/mcp.json; exit 1; }
          echo "ok (macos): the shipped binary runs the stdio MCP server with 6 tools incl. search"
      - name: Assert the app-served agent skills (R23.6)
        run: |
          set -e
          export ANCHOR_OPEN_BROWSER=0 ANCHOR_SECRETS_NO_KEYRING=1
          rm -rf /tmp/ac-skill-smoke && mkdir -p /tmp/ac-skill-smoke
          ./dist/AnchorCore.app/Contents/MacOS/AnchorCore --port 8129 --data-dir /tmp/ac-skill-smoke --no-tray > /tmp/ac-skill-smoke.log 2>&1 &
          SRV=$!
          trap "kill $SRV 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8129/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8129/health >/dev/null || { echo "FAULT: skill-smoke server did not start"; cat /tmp/ac-skill-smoke.log; exit 1; }
          for SKILL in setup search; do
            curl -sf -D /tmp/skill-headers.txt "http://127.0.0.1:8129/system/skills/$SKILL" -o /tmp/skill-served.md
            grep -qi 'content-type: text/markdown' /tmp/skill-headers.txt || { echo "FAULT: /system/skills/$SKILL is not text/markdown"; cat /tmp/skill-headers.txt; exit 1; }
            cmp /tmp/skill-served.md ".agents/skills/anchorcore-$SKILL/SKILL.md" || { echo "FAULT: /system/skills/$SKILL bytes differ from the repo SKILL.md"; exit 1; }
          done
          if curl -sf http://127.0.0.1:8129/system/skills/nope -o /dev/null; then echo "FAULT: unknown skill did not 404"; exit 1; fi
          echo "ok (macos): /system/skills/:name serves setup + search byte-identical"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-macos
          path: dist/AnchorCore-macos.zip

  build-rust-windows:
    name: Rust Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Cargo build --release
        working-directory: rust
        run: cargo build --release --manifest-path Cargo.toml
      - name: Zip binaries
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item rust/target/release/anchorcore.exe dist/anchorcore.exe
          Push-Location dist
          Compress-Archive -Path anchorcore.exe -DestinationPath AnchorCore-windows.zip -Force
          Pop-Location
      - name: Assert the MCP-capable binary (R20.5)
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path dist/anchorcore.exe)) { throw "FAULT: dist/anchorcore.exe missing" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/AnchorCore-windows.zip))
          $names = @($zip.Entries | ForEach-Object { $_.FullName })
          $zip.Dispose()
          if ($names -notcontains "anchorcore.exe") { throw "FAULT: anchorcore.exe is not in AnchorCore-windows.zip" }
          $req = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' + "`n" + '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' + "`n"
          $resp = ($req | & dist/anchorcore.exe mcp | Out-String)
          if ($resp -notmatch '"search"') { throw "FAULT: search tool missing`n$resp" }
          Write-Host "ok (windows): the shipped exe runs the stdio MCP server with 6 tools incl. search"
      - name: Assert the app-served agent skills (R23.6)
        run: |
          $ErrorActionPreference = "Stop"
          $env:ANCHOR_OPEN_BROWSER = "0"
          $env:ANCHOR_SECRETS_NO_KEYRING = "1"
          $dataDir = Join-Path $env:TEMP "ac-skill-smoke"
          if (Test-Path $dataDir) { Remove-Item -Recurse -Force $dataDir }
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $proc = Start-Process -FilePath (Resolve-Path dist/anchorcore.exe) -ArgumentList "--port","8129","--data-dir",$dataDir,"--no-tray" -RedirectStandardOutput (Join-Path $dataDir "smoke.log") -RedirectStandardError (Join-Path $dataDir "smoke.err.log") -PassThru
          try {
            $up = $false
            for ($i = 0; $i -lt 30; $i++) {
              & curl.exe -sf http://127.0.0.1:8129/health -o NUL 2>$null
              if ($LASTEXITCODE -eq 0) { $up = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $up) { Get-Content (Join-Path $dataDir "smoke.log") -Raw -ErrorAction SilentlyContinue; Get-Content (Join-Path $dataDir "smoke.err.log") -Raw -ErrorAction SilentlyContinue; throw "FAULT: skill-smoke server did not start" }
            foreach ($skill in @("setup", "search")) {
              & curl.exe -sf -D (Join-Path $env:TEMP "skill-headers.txt") "http://127.0.0.1:8129/system/skills/$skill" -o (Join-Path $env:TEMP "skill-served.md") 2>$null
              if ($LASTEXITCODE -ne 0) { throw "FAULT: /system/skills/$skill request failed" }
              $headers = Get-Content (Join-Path $env:TEMP "skill-headers.txt") -Raw
              if ($headers -notmatch "(?i)content-type:\s*text/markdown") { throw "FAULT: /system/skills/$skill is not text/markdown" }
              $served = [IO.File]::ReadAllBytes((Join-Path $env:TEMP "skill-served.md"))
              $repo = [IO.File]::ReadAllBytes(".agents/skills/anchorcore-$skill/SKILL.md")
              $same = ($served.Length -eq $repo.Length) -and (-not (Compare-Object $served $repo -SyncWindow 0))
              if (-not $same) { throw "FAULT: /system/skills/$skill bytes differ from the repo SKILL.md" }
            }
            $code = & curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8129/system/skills/nope 2>$null
            if ($code -ne "404") { throw "FAULT: /system/skills/nope returned [$code], expected 404" }
            Write-Host "ok (windows): /system/skills/:name serves setup + search byte-identical"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Upload Rust Windows
        uses: actions/upload-artifact@v4
        with:
          name: AnchorCore-windows
          path: dist/AnchorCore-windows.zip

  # Optional cross-compile from Linux using `cross` (R5.2 stretch):
  # Uncomment to build all targets from one runner:
  # cross-build:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo install cross --git https://github.com/cross-rs/cross
  #     - uses: actions/setup-node@v4
  #       with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
  #     - run: npm ci && npm run build
  #       working-directory: frontend
  #     - run: cross build --release --target x86_64-unknown-linux-gnu --manifest-path rust/Cargo.toml
  #     - run: cross build --release --target x86_64-pc-windows-gnu --manifest-path rust/Cargo.toml
  #     - run: cross build --release --target x86_64-apple-darwin --manifest-path rust/Cargo.toml


  docker-team:
    name: Team image — publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=team
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hosting/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=team-image
          cache-to: type=gha,mode=max,scope=team-image

  deploy-website:
    name: Website — deploy to anchorcore.dev (when changed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the change-detection step can diff against the
          # previous tag (default shallow checkout has no earlier tags).
          fetch-depth: 0
      - name: Detect website changes since previous tag
        id: changes
        run: |
          CUR="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${CUR}^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "No previous tag found; treating website as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV" "$CUR" -- website/; then
            echo "website/ unchanged since $PREV; skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "website/ changed since $PREV."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          # Project wrangler (^4.149) requires Node >= 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Website build
        if: steps.changes.outputs.changed == 'true'
        working-directory: website
        run: npm ci && npm run build
      - name: Deploy to anchorcore.dev
        if: steps.changes.outputs.changed == 'true'
        working-directory: website
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: Attach artifacts to release
    needs: [build-rust-linux, build-rust-macos, build-rust-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the platform zips: the docker-team job's *.dockerbuild
          # provenance record is not a valid zip and breaks an unfiltered
          # download (5 failed retries on v1.0.14).
          pattern: AnchorCore-*
          merge-multiple: true
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
