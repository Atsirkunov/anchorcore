name: CI

on: push

jobs:
  backend:
    name: Backend tests (Python, archived)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore archived backend/
        run: |
          git fetch origin tag archive/python-final --no-tags
          git checkout archive/python-final -- backend
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Frozen backend's __version__ (1.0.12) intentionally lags live Cargo.toml —
      # test_version_is_single_source_of_truth compares the two, so it fails on
      # every version bump. Deselected; version single-source is enforced by the
      # version-drift job (scripts/sync_version.py --check).
      - run: PYTHONPATH=backend python -m pytest backend/tests -q --ignore=backend/tests/test_mcp.py --deselect backend/tests/test_system.py::test_version_is_single_source_of_truth

  version-drift:
    name: Version single-source check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/sync_version.py --check
      - run: python rust/scripts/sync_version.py --check

  rust-conformance:
    name: Rust conformance (vs Rust on :8123)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - name: Restore archived backend/ (conformance suite)
        run: |
          git fetch origin tag archive/python-final --no-tags
          git checkout archive/python-final -- backend
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (for Rust embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Rust deps cache
        uses: Swatinem/rust-cache@v2
      - name: Build Rust binary
        working-directory: rust
        run: cargo build -p anchorcore
      - name: Cargo check + unit tests
        working-directory: rust
        run: |
          cargo check -p anchorcore
          cargo test -p anchorcore -- --nocapture
      - name: No OpenSSL dependency (Windows runner has none)
        working-directory: rust
        run: |
          if cargo tree -p anchorcore --prefix none -e normal 2>/dev/null | grep -qiE "openssl-sys|native-tls"; then
            echo "forbidden: openssl/native-tls in dependency tree (breaks Windows release build)"; exit 1
          fi
      - name: Clippy (unwrap_used)
        working-directory: rust
        run: cargo clippy -p anchorcore -- -D clippy::unwrap_used --allow clippy::needless_return --allow clippy::manual_range_contains || echo "clippy warnings allowed for now (R11.3) — fix gradually"
      - name: Start Rust on :8123
        run: |
          rm -rf /tmp/ac-ci-data /tmp/ac-ci-test.db
          mkdir -p /tmp/ac-ci-data
          ANCHOR_DATA_DIR=/tmp/ac-ci-data ANCHOR_DATABASE_URL=sqlite:////tmp/ac-ci-test.db \
            ANCHOR_SECRETS_NO_KEYRING=1 ANCHOR_OLLAMA_BASE_URL=http://localhost:1 \
            ANCHOR_ALLOW_TEST_URLS=1 \
            ANCHOR_CLASSIFIER_TIMEOUT=1.0 ANCHOR_HTTP_CONNECT_TIMEOUT=0.2 \
            ANCHOR_ANSWER_BASE_URL=https://api.openai.com/v1 \
            ./rust/target/debug/anchorcore --port 8123 --data-dir /tmp/ac-ci-data &
          echo $! > /tmp/ac-ci.pid
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8123/health | grep -q ok; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/health || (cat /tmp/ac-ci-data/anchorcore.log || true; exit 1)
      - name: Conformance pytest vs Rust
        run: |
          pip install -r backend/requirements.txt
          # Same deselect as backend job: frozen __version__ lags live Cargo.toml.
          # B54: Rust /system/onboarding adds answer_ready; the frozen exact-shape
          # assertion (test_onboarding_state) predates it. Deselected here only —
          # the backend job still runs it against frozen Python (5 keys).
          PYTHONPATH=backend ANCHOR_DATA_DIR=/tmp/ac-ci-data ANCHOR_DATABASE_URL=sqlite:////tmp/ac-ci-test.db \
            ANCHOR_SECRETS_NO_KEYRING=1 ANCHOR_TEST_RUST_URL=http://127.0.0.1:8123 \
            python -m pytest backend/tests -q --ignore=backend/tests/test_mcp.py --deselect backend/tests/test_system.py::test_version_is_single_source_of_truth --deselect backend/tests/test_system.py::test_onboarding_state
      - name: MCP smoke — 6 tools + a search on sample/ (R20.5)
        run: |
          set -e
          API=http://127.0.0.1:8123
          BIN=rust/target/debug/anchorcore
          
          # Every API call goes through this helper: on any non-2xx it prints the method,
          # path, status and body, so a failure names itself instead of surfacing as a
          # Python traceback three lines later.
          api() {
            method="$1"; path="$2"; data="${3:-}"
            if [ -n "$data" ]; then
              raw=$(curl -sS -w "\n%{http_code}" -X "$method" "$API$path" -H "content-type: application/json" -d "$data")
            else
              raw=$(curl -sS -w "\n%{http_code}" -X "$method" "$API$path")
            fi
            status=$(printf "%s" "$raw" | tail -n1)
            payload=$(printf "%s" "$raw" | sed "$d")
            case "$status" in
              2*) printf "%s" "$payload" ;;
              *) echo "FAULT: $method $path -> HTTP $status"; echo "$payload"; exit 1 ;;
            esac
          }
          field() { python3 -c "import json,sys; print(json.load(sys.stdin).get('$1'))"; }
          
          api GET /health >/dev/null
          # ingest the repo's sample corpus so the search has something real to cite
          SRC=$(api POST /sources "{\"connector\":\"folder\",\"name\":\"sample\",\"label\":\"internal\",\"config\":{\"path\":\"$PWD/sample\"}}" | field id)
          echo "created source: $SRC"
          JOB_JSON=$(api POST "/sources/$SRC/sync")
          echo "sync job: $JOB_JSON"
          JOB=$(printf "%s" "$JOB_JSON" | field id)
          ST=""
          for i in $(seq 1 60); do
            ST=$(api GET "/sources/jobs/$JOB" | field status)
            if [ "$ST" = "succeeded" ] || [ "$ST" = "failed" ]; then break; fi
            sleep 2
          done
          echo "sync job $JOB finished: $ST"
          [ "$ST" = "succeeded" ] || { echo "FAULT: sample sync did not succeed"; exit 1; }
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search","arguments":{"query":"billing provider migration"}}}' \
            | ANCHOR_BACKEND_URL=$API $BIN mcp > /tmp/mcp.json || echo "note: mcp exited $? after stdin closed (output is what is asserted)"
          grep -q '"search"' /tmp/mcp.json || { echo "FAULT: search tool missing"; cat /tmp/mcp.json; exit 1; }
          count=$(grep -o '"name": "[a-z_]*"' /tmp/mcp.json | sort -u | wc -l)
          [ "$count" -eq 6 ] || { echo "FAULT: expected 6 MCP tools, saw $count"; cat /tmp/mcp.json; exit 1; }
          grep -qi "billing" /tmp/mcp.json || { echo "FAULT: search over sample/ returned nothing about billing"; cat /tmp/mcp.json; exit 1; }
          echo "ok: 6 tools, and a search over sample/ returned the billing material"
      - name: Stop Rust
        if: always()
        run: kill $(cat /tmp/ac-ci.pid) || true; sleep 1; cat /tmp/ac-ci-data/anchorcore.log || true

  frontend:
    name: Frontend build + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  website:
    name: Website build + typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker-team:
    name: Team image (one container) — build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build (hosting/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hosting/Dockerfile
          tags: anchorcore:team
          load: true
          cache-from: type=gha,scope=team-image
          cache-to: type=gha,mode=max,scope=team-image
      - name: Refuses to boot without a license
        run: |
          if timeout 90 docker run --rm anchorcore:team; then
            echo "FAIL: Team image booted without a license"; exit 1
          fi
      - name: Boots (edition override) and serves /health
        run: |
          docker run -d --name ac-smoke -e ANCHOR_EDITION=personal -p 8000:8000 anchorcore:team
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Container logs on failure
        if: failure()
        run: docker logs ac-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f ac-smoke || true
