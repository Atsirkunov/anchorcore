name: CI

# Docs-only pushes skip CI: the run is skipped only when EVERY changed file
# matches. Tag pushes ignore path filters, so a release tag always runs the
# full suite. Never add markdown that the build or tests read (.agents/skills/
# SKILL.md is compiled in; sample/, sample-ai/ and tests/eval_data are test
# fixtures; website/ prerenders docs/guides — checked on every tag push).
on:
  push:
    paths-ignore:
      - "*.md" # root only: README, AGENTS, LICENSE
      - "docs/**"
      - "rust/*.md" # BACKLOG, BACKLOG-archive, AGENTS, README
      - "rust/docs/**"

jobs:
  version-drift:
    name: Version single-source check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/sync_version.py --check
      - run: python rust/scripts/sync_version.py --check

  rust:
    name: Rust build + tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (for Rust embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Rust deps cache
        uses: Swatinem/rust-cache@v2
      - name: Build Rust binary
        working-directory: rust
        run: cargo build -p anchorcore
      - name: Cargo check + tests (unit + API contract + golden eval)
        working-directory: rust
        run: |
          cargo check -p anchorcore
          cargo test -p anchorcore -- --nocapture
      - name: No OpenSSL dependency (Windows runner has none)
        working-directory: rust
        run: |
          if cargo tree -p anchorcore --prefix none -e normal 2>/dev/null | grep -qiE "openssl-sys|native-tls"; then
            echo "forbidden: openssl/native-tls in dependency tree (breaks Windows release build)"; exit 1
          fi
      - name: Clippy (unwrap_used)
        working-directory: rust
        run: cargo clippy -p anchorcore -- -D clippy::unwrap_used --allow clippy::needless_return --allow clippy::manual_range_contains || echo "clippy warnings allowed for now (R11.3) — fix gradually"
      - name: MCP smoke — stdio handshake, 6 tools (R20.5)
        run: |
          set -e
          # The binary is the shipped artifact shape: one file that also speaks MCP over
          # stdio. No app needed for tools/list, so this assertion has nothing between it
          # and the result (the end-to-end search smoke is the next step, R20.10).
          BIN=rust/target/debug/anchorcore
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | $BIN mcp > /tmp/mcp.json || echo "note: mcp exited $? after stdin closed (its output is what is asserted)"
          cat /tmp/mcp.json
          grep -q '"search"' /tmp/mcp.json || { echo "FAULT: the search tool is missing from tools/list"; exit 1; }
          for t in ask search get_entity get_source list_sources memory_status; do
            grep -q "\"name\":\"$t\"" /tmp/mcp.json || { echo "FAULT: MCP tool '$t' missing from tools/list"; cat /tmp/mcp.json; exit 1; }
          done
          echo "ok: tools/list over stdio carries all six tools (ask, search, get_entity, get_source, list_sources, memory_status)"
          echo "ok: the built binary answers tools/list over stdio with 6 tools incl. search"
      - name: MCP smoke — end-to-end search over sample/ (R20.10)
        # REST: folder source over sample/ → sync; then `anchorcore mcp` over stdio
        # (ANCHOR_BACKEND_URL) must return the billing documents from `search`.
        # Same script runs locally: scripts/ci_mcp_search_smoke.sh <binary>.
        run: bash scripts/ci_mcp_search_smoke.sh rust/target/debug/anchorcore "$GITHUB_WORKSPACE"

  rust-desktop:
    # R45.4: the built-in embedder adds candle + tokenizers (and Metal on
    # macOS). Release builds for Windows/macOS only run on tags, so prove
    # every push builds there and the embedder's model-free tests pass.
    name: Rust build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (for Rust embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build binary
        working-directory: rust
        run: cargo build -p anchorcore
      - name: Embedder tests (no weights)
        working-directory: rust
        env:
          ANCHOR_SECRETS_NO_KEYRING: "1"
        run: cargo test -p anchorcore --lib -- model_store embed_local embedder
      - name: CLI answers without a model
        working-directory: rust
        shell: bash
        run: |
          out=$(ANCHOR_TRAY=0 target/debug/anchorcore --data-dir "$RUNNER_TEMP/ac" embed-model status)
          echo "$out"
          echo "$out" | grep -q "nomic-embed-text-v1.5 missing"

  frontend:
    name: Frontend build + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  website:
    name: Website build + typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker-team:
    name: Team image (one container) — build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build (hosting/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hosting/Dockerfile
          tags: anchorcore:team
          load: true
          cache-from: type=gha,scope=team-image
          cache-to: type=gha,mode=max,scope=team-image
      - name: Refuses to boot without a license
        run: |
          if timeout 90 docker run --rm anchorcore:team; then
            echo "FAIL: Team image booted without a license"; exit 1
          fi
      - name: Boots (edition override) and serves /health
        run: |
          docker run -d --name ac-smoke -e ANCHOR_EDITION=personal -p 8000:8000 anchorcore:team
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Container logs on failure
        if: failure()
        run: docker logs ac-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f ac-smoke || true
