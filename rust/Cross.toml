# Cross configuration for R5.2 — cross-compile win/mac/linux from one runner
# Usage: cargo install cross --git https://github.com/cross-rs/cross && cross build --release --target <triple> --manifest-path rust/Cargo.toml

[target.x86_64-unknown-linux-gnu]
pre-build = ["apt-get update && apt-get install -y pkg-config libssl-dev"]

[target.x86_64-pc-windows-gnu]
pre-build = ["apt-get update && apt-get install -y mingw-w64"]

[target.x86_64-apple-darwin]
# macOS cross requires osxcross SDK — use native macos-latest runner instead (see release.yml build-rust-macos)
pre-build = []

[target.aarch64-apple-darwin]
pre-build = []
