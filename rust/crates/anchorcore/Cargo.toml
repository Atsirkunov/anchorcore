[package]
name = "anchorcore"
version.workspace = true
edition.workspace = true
description = "AnchorCore — company memory, Rust port (incremental, contract-first)"
license.workspace = true

[[bin]]
name = "anchorcore"
path = "src/main.rs"

[[bin]]
name = "anchorcore-mcp"
path = "src/bin/mcp.rs"

[dependencies]
aes = "0.8"
axum = { version = "0.7", features = ["json"] }
cbc = "0.1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
keyring = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
rand = "0.8"
dotenvy = "0.15"
walkdir = "2"
notify = "6"
include_dir = "0.7"
mime_guess = "2"
open = "5"

[dev-dependencies]
tempfile = "3"
tower = "0.5"
# conformance: reuse Python backend/tests as black-box HTTP tests
