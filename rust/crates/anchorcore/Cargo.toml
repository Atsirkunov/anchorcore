[package]
name = "anchorcore"
version.workspace = true
edition.workspace = true
description = "AnchorCore — company memory, Rust port (incremental, contract-first)"
license.workspace = true

[[bin]]
name = "anchorcore"
path = "src/main.rs"

[dependencies]
aes = "0.8"
axum = { version = "0.7", features = ["json", "multipart"] }
cbc = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v7"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy", "multipart", "stream"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
quick-xml = "0.42"
calamine = "0.36"
zip = { version = "9", default-features = false, features = ["deflate"] }
mailparse = "0.18"
flate2 = "1"
keyring = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
rand = "0.8"
dotenvy = "0.15"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ignore = "0.4"
pdf-extract = "0.12"
notify = "6"
include_dir = "0.7"
mime_guess = "2"
open = "5"

[dev-dependencies]
tempfile = "3"
tower = "0.5"
# tests/api_*: black-box HTTP contract tests (spawn the binary, reqwest)

# R34.1: tray is Windows/macOS only — target-gated so Linux/CI builds need no
# system tray libraries (tray.rs is a stub there).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26"
# R34.1 macOS: NSApplication must exist before NSStatusBar builds the item —
# without it macOS 15 aborts (CGSConnection assertion, uncatchable). Proven by
# the Swift probe, see docs/tray.md.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
