[package]
name = "anchorcore"
version.workspace = true
edition.workspace = true
description = "AnchorCore — company memory, Rust port (incremental, contract-first)"
license.workspace = true

[[bin]]
name = "anchorcore"
path = "src/main.rs"

[dependencies]
aes = "0.8"
axum = { version = "0.7", features = ["json", "multipart"] }
cbc = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v7"] }
# R30.2: ordered, bounded in-flight embed batches (`buffered`); already in the lock via reqwest.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy", "multipart", "stream"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
quick-xml = "0.42"
calamine = "0.36"
zip = { version = "9", default-features = false, features = ["deflate"] }
mailparse = "0.18"
flate2 = "1"
keyring = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
rand = "0.8"
dotenvy = "0.15"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ignore = "0.4"
pdf-extract = "0.12"
# R46.16: PDF image objects (same versions pdf-extract already pulls in)
lopdf = { version = "0.42", default-features = false }
png = "0.18"
notify = "6"
include_dir = "0.7"
mime_guess = "2"
open = "5"
# R45.4: built-in embedder (nomic-embed-text v1.5, candle). Pure Rust on the
# CPU path (gemm; tokenizers without Oniguruma/esaxx) so Linux and Windows
# MinGW need no system libraries; Metal is added on macOS below.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
# tests/api_*: black-box HTTP contract tests (spawn the binary, reqwest)

# R34.1: tray is Windows/macOS only — target-gated so Linux/CI builds need no
# system tray libraries (tray.rs is a stub there).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26"
# R34.1 macOS: NSApplication must exist before NSStatusBar builds the item —
# without it macOS 15 aborts (CGSConnection assertion, uncatchable). Proven by
# the Swift probe, see docs/tray.md.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
# R45.4: Metal for the built-in embedder (f16; CPU fallback when unavailable).
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
# R45.6: total RAM (`sysctlbyname("hw.memsize")`) for the wizard's model picker.
libc = "0.2"
# R41.5 Windows: tray-icon's hidden window needs a message loop on the thread
# that created it (same version tray-icon already pulls in).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }
